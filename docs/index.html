<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS455 Car Testing</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #20232b;
      color: #e7eaf0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px;
    }
    #game {
      border: 1px solid #555;
      background: #151820;
      max-width: 96vw;
      max-height: 80vh;
      image-rendering: crisp-edges;
    }
    .hud {
      max-width: 96vw;
      font-size: 14px;
      line-height: 1.4;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #313846;
      margin-right: 8px;
    }
    #report {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
    }
    #reportCard {
      width: min(760px, 92vw);
      background: #1b2130;
      border: 2px solid #cf6f6f;
      border-radius: 8px;
      padding: 12px 14px;
    }
    #closeReport {
      float: right;
      background: #7f3e3e;
      color: #fff;
      border: 1px solid #b87171;
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 10px;
    }
    ul { margin: 6px 0 0 18px; max-height: 220px; overflow: auto; }
  </style>
</head>
<body>
  <canvas id="game" width="836" height="680"></canvas>
  <div class="hud">
    <span class="pill">Move: WASD / Arrows</span>
    <span class="pill">Space: Stall / God auto-step</span>
    <span class="pill">G: Toggle God Mode</span>
    <span class="pill">R: Reset</span>
    <span class="pill">X: Incident Report</span>
  </div>
  <div class="hud" id="status"></div>

  <div id="report">
    <div id="reportCard">
      <button id="closeReport">X</button>
      <h3 style="margin: 0 0 8px 0;">Incident Report</h3>
      <div id="reportSummary"></div>
      <ul id="reportList"></ul>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
